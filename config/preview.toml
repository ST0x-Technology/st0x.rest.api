# Push logs + traces to the rain observability stack over the rain tailnet
# (VictoriaLogs :9428, VictoriaTraces :10428 on the rain-management-observability
# droplet). Non-secret plaintext; the OTLP path is fail-open if the box is
# unreachable.
[telemetry]
service_name = "st0x-rest-api"
environment = "staging"
logs_endpoint = "http://rain-management-observability.taile5cf8a.ts.net:9428"
traces_endpoint = "http://rain-management-observability.taile5cf8a.ts.net:10428"
