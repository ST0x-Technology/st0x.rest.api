log_dir = "/mnt/data/st0x-rest-api-preview/logs"
database_url = "sqlite:///mnt/data/st0x-rest-api-preview/st0x.db"
database_max_connections = 10
usage_log_max_concurrency = 2
response_cache_max_entries = 1000
response_cache_ttl_seconds = 5
registry_url = "https://raw.githubusercontent.com/ST0x-Technology/st0x.registry/b74bf8cbd8da42662614d1427d3c51cb4dafc074/registry"
private_registry_path = "/mnt/data/st0x-rest-api-preview/private-registry.data"
allow_registry_fallback = true
rate_limit_global_rpm = 600
rate_limit_per_key_rpm = 60
docs_dir = "/var/lib/st0x-docs"
local_db_path = "/mnt/data/st0x-rest-api-preview/raindex.db"

# Push logs + traces to the self-hosted observability stack over the tailnet
# (VictoriaLogs :9428, VictoriaTraces :10428 on the st0x-observability GCE VM).
# Non-secret plaintext; the OTLP path is fail-open if the box is unreachable.
[telemetry]
service_name = "st0x-rest-api"
environment = "staging"
logs_endpoint = "http://st0x-observability:9428"
traces_endpoint = "http://st0x-observability:10428"
